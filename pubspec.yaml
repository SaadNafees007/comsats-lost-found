name: comsats_lost_found
description: COMSATS Lost & Found Mobile Application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ==========================
  # State Management
  # ==========================
  flutter_riverpod: ^2.6.1

  # ==========================
  # Navigation
  # ==========================
  go_router: ^16.1.0

  # ==========================
  # Firebase
  # ==========================
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # ==========================
  # Local Storage
  # ==========================
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # ==========================
  # Environment Variables
  # ==========================
  flutter_dotenv: ^5.2.1

  # ==========================
  # Network
  # ==========================
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.7.2

  # ==========================
  # Image Picker
  # ==========================
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

  # ==========================
  # Utilities
  # ==========================
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

  # ==========================
  # UI
  # ==========================
  flutter_svg: ^2.2.0

  # ==========================
  # Models & Code Generation
  # ==========================
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # ==========================
  # Logging
  # ==========================
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^9.0.0

  # Code Generation
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/

  # Uncomment after adding fonts
  #
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700