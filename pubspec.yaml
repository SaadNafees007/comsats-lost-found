name: comsats_lost_found
description: COMSATS Lost & Found Mobile Application

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -------------------------
  # State Management
  # -------------------------
  flutter_riverpod: ^2.6.1

  # -------------------------
  # Navigation
  # -------------------------
  go_router: ^16.3.0

  # -------------------------
  # Firebase
  # -------------------------
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.0.1

  # -------------------------
  # Local Storage
  # -------------------------
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # -------------------------
  # Image Handling
  # -------------------------
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

  # -------------------------
  # Utilities
  # -------------------------
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.0.0

  # -------------------------
  # Environment
  # -------------------------
  flutter_dotenv: ^5.2.1

  # -------------------------
  # Logging
  # -------------------------
  logger: ^2.6.1

  # -------------------------
  # Equality
  # -------------------------
  equatable: ^2.0.7
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^9.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # -------------------------
  # Assets
  # -------------------------
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/illustrations/

  # -------------------------
  # Fonts
  # -------------------------
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700